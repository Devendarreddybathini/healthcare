
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fhir-splitter-no-children-agg"
version = "0.1.0"
description = "UI lists individual child files; no aggregated children.json in ZIP"
requires-python = ">=3.9"
dependencies = ["fastapi>=0.115.0","uvicorn>=0.30.0","python-multipart>=0.0.9","SQLAlchemy>=2.0.0","PyMySQL>=1.1.0","python-dotenv>=1.0.0"]

[tool.setuptools]
packages = ["fhir_splitter_no_children_agg"]
